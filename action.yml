name: "Build XPI for UXP"
description: "Parses install.rdf, updates version metadata, and packages files into an XPI"
author: "FranklinDM"
branding:
  color: "blue"
  icon: "package"
inputs:
  package-name:
    description: "Base package name for the XPI"
    required: true
  source-dir:
    description: "Source directory containing install.rdf and extension contents (use '.' for repo root)"
    required: false
    default: "src"
outputs:
  xpi-filename:
    description: "Generated XPI filename"
    value: ${{ steps.build_step.outputs.xpi_filename }}
  is-prerelease:
    description: "Whether the version string matches a Mozilla-style prerelease pattern (a#/b#/rc#)"
    value: ${{ steps.build_step.outputs.is_prerelease }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Parse metadata, modify manifest, and build XPI
      id: build_step
      shell: bash
      env:
        PACKAGE_NAME: ${{ inputs.package-name }}
        SOURCE_DIR: ${{ inputs.source-dir }}
        REF_TYPE: ${{ github.ref_type }}
        SHA: ${{ github.sha }}
      run: |
        python "${{ github.action_path }}/src/xpatool.py" build "${{ inputs.source-dir }}" -n "${{ inputs.package-name }}" --github-output

    - name: Upload XPI artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.build_step.outputs.xpi_filename }}
        path: ${{ steps.build_step.outputs.xpi_filename }}
